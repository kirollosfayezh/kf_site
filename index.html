<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icon set, in the order browsers and crawlers look for them.

      The SVG is what modern browsers show in the tab. `/favicon.ico` exists
      because Google Search fetches that path by convention and does not take
      SVG for the search-results favicon — without it the result had no icon at
      all. Both are square: Google rejects a non-square favicon, and the file
      that used to be here was 48x46 (and the wrong logo entirely).
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0A0D" />

    <!--
      The fonts used to be pulled in by an `@import` at the top of index.css.
      That makes a request chain three deep before a single glyph is fetched:
      HTML -> our CSS -> Google's CSS -> the font files, with the browser
      unable to discover the last two until the first has parsed. Declaring
      them here lets the preload scanner start the handshake immediately.

      Loaded with media="print" and flipped to "all" on load, so the stylesheet
      is fetched at high priority but never blocks the first paint. A plain
      stylesheet link here holds the entire page blank until Google answers —
      measured at 28s on a bad connection, which reads as the whole site being
      frozen. With this, text paints immediately in the fallback face and swaps
      when the webfont arrives (the URL already carries display=swap).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KF Tech Solutions — Ideas into real, working products</title>
    <!--
      Stamped `data-kf-seo` so the runtime SEO layer treats this as one of its
      own and removes it before writing the real per-page description. Without
      the stamp the page ended up with two description tags in dev — this static
      one plus the applied one — and the stale static one, being first, is what
      a scraper reads. The build-time prerender strips it as well, so there is
      exactly one description in every environment.
    -->
    <meta
      name="description"
      data-kf-seo="1"
      content="KF Tech Solutions builds custom software, POS systems, dashboards and AI automation for real businesses."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
