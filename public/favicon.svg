<!--
  KF Tech Solutions mark: the code-window monitor from `logo-icon.png`, redrawn
  as a square SVG.

  The file that used to sit here was an unrelated purple/blue glyph left over
  from a template (#863bff), 48x46 — not the brand, and not square, which Google
  rejects for the search-results favicon. This is the real mark, on a square
  canvas, at the brand gradient.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KF Tech Solutions">
  <defs>
    <linearGradient id="kf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A2E"/>
      <stop offset="45%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
  </defs>

  <!-- screen -->
  <rect x="3" y="6" width="58" height="40" rx="9" fill="url(#kf)"/>
  <rect x="7.6" y="10.6" width="48.8" height="30.8" rx="5.4" fill="none" stroke="#fff" stroke-width="2.6"/>

  <!-- </> -->
  <g fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 19.5 16.8 26 24 32.5"/>
    <path d="M40 19.5 47.2 26 40 32.5"/>
    <path d="M35.4 17.8 28.6 34.2"/>
  </g>

  <!-- stand -->
  <path d="M28.4 46h7.2v6h-7.2z" fill="url(#kf)"/>
  <rect x="19" y="51.5" width="26" height="6.5" rx="3.25" fill="url(#kf)"/>
</svg>
